<header class="hdr">
  <div class="hdr-in">

    <div class="hdr-meta"><span>プロトタイプ（サンプルデータ）</span></div>

<main class="landing">
  <div class="stack" style="gap:8px">
    <h1>実践DXクエスト</h1>
    <p>大企業でDXに関わりたい社員を、中小企業の「本当に解決したい課題」に派遣し、成果物づくりを通じてDX人材を育てる仕組みです。スキルはデジタルスキル標準 ver.2.0（IPA）のロールと共通スキルリストで管理します。</p>
  </div>
  <a class="entry" href="admin/">
    <h2>事務局サイト</h2>
    <p class="muted">クエスト管理（課題と必要スキル）／人材データバンク（需給・候補者・登録人材一覧）</p>
  </a>
  <a class="entry" href="company/">
    <h2>企業ポータル（大企業 人事部）</h2>
    <p class="muted">クエスト一覧（事務局の推薦ロール）／自社人材の育成状況（派遣前後のスキル変化・分類別のレーダーチャート）</p>
  </a>
  <p class="sub">画面に表示している企業名・人名・評価はすべて架空のサンプルです。</p>
